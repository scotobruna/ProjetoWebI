<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusFind - Objetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-primary text-white p-4">
    <h2>BusFind</h2>
    <p>Achados e Perdidos</p>
</header>

<nav class="navbar navbar-expand bg-light">
    <div class="container">
        <a class="nav-link" href="index.html">Objetos</a>
        <a class="nav-link" href="linhas.html">Linhas</a>
        <a class="nav-link" href="devolucoes.html">Devoluções</a>
    </div>
</nav>

<main class="container mt-4">

    <h3>Cadastro de Objetos</h3>

    <form id="formObjeto">
        <label>Descrição:</label>
        <input type="text" id="descricao" class="form-control" required>

        <label>Categoria:</label>
        <input type="text" id="categoria" class="form-control" required>

        <label>Data encontrada:</label>
        <input type="date" id="dataEncontrado" class="form-control" required>

        <label>Linha:</label>
        <input type="number" id="linhaId" class="form-control" required>

        <label>Status:</label>
        <input type="text" id="status" class="form-control" required>

        <button type="submit" class="btn btn-primary mt-3">Cadastrar objeto</button>
    </form>

    <h3 class="mt-4">Objetos cadastrados</h3>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Data</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaObjetos"></tbody>
    </table>

    <section class="mt-5 mb-4">
        <h3>Contato</h3>
        <p>E-mail: scotomeirellesbruna@gmail.com</p>

        <form>
            <label>Nome:</label>
            <input type="text" class="form-control" required>

            <label>E-mail:</label>
            <input type="email" class="form-control" required>

            <label>Mensagem:</label>
            <textarea class="form-control" rows="3" required></textarea>

            <button type="button" class="btn btn-primary mt-3">Enviar</button>
        </form>
    </section>

</main>

<footer class="bg-dark text-white text-center p-3">
    BusFind - Achados e Perdidos
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
