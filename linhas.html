<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusFind - Linhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-primary text-white p-4">
    <h2>BusFind</h2>
    <p>Achados e Perdidos</p>
</header>

<nav class="navbar navbar-expand bg-light">
    <div class="container">
        <a class="nav-link" href="index.html">Objetos</a>
        <a class="nav-link" href="linhas.html">Linhas</a>
        <a class="nav-link" href="devolucoes.html">Devoluções</a>
    </div>
</nav>

<main class="container mt-4">

    <h3>Cadastro de Linhas</h3>

    <form id="formLinha">
        <label>Número da linha:</label>
        <input type="text" id="numero" class="form-control" required>

        <label>Identificação:</label>
        <input type="text" id="identificacao" class="form-control" required>

        <button type="submit" class="btn btn-primary mt-3">Cadastrar linha</button>
    </form>

    <h3 class="mt-4">Linhas cadastradas</h3>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Número</th>
                <th>Identificação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaLinhas"></tbody>
    </table>

</main>

<footer class="bg-dark text-white text-center p-3">
    BusFind - Achados e Perdidos
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
